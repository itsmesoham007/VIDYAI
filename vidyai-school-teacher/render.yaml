# ==============================================================================
# VidyAI — One-Click Render Deployment Blueprint
# Deploys the FastAPI GSEB English Medium backend on Render's Python runtime
# ==============================================================================
services:
  - type: web
    name: vidyai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render Dashboard
      - key: HOST
        value: 0.0.0.0
      - key: WHATSAPP_TOKEN
        sync: false # Set securely in Render Dashboard
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false # Set securely in Render Dashboard
      - key: WHATSAPP_VERIFY_TOKEN
        value: vidyai_whatsapp_verify_token
      - key: WHATSAPP_API_VERSION
        value: v21.0
